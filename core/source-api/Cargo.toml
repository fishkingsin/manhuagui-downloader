[package]
name = "source-api"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { workspace = true, features = ["serde"] }
eyre = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, optional = true, features = ["derive", "chrono"] }
specta-util = { workspace = true, optional = true }
strfmt = { version = "0.2.5" }
tracing = { workspace = true }
walkdir = { version = "2.5.0" }

[features]
specta = ["dep:specta", "dep:specta-util"]

